<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products - Shop</title>
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
      body{background:#f2f6fb;padding-top:70px}
      .card-img-top{height:180px;object-fit:contain}
      .toast-pos{position:fixed;right:20px;bottom:20px;z-index:1050}
    </style>
  </head>
  <body>
    <div id="siteHeader"></div>

    <div class="container">
      <div class="row mb-3">
        <div class="col-12">
          <h3>Products</h3>
        </div>
      </div>

      <div class="row">
        <div class="col-md-3">
          <div class="card mb-3">
            <div class="card-body">
              <h6>Filter</h6>
              <label class="form-label">Price Range: <span id="priceRangeVal">Any</span></label>
              <input id="priceRange" type="range" class="form-range" min="0" max="1000" step="1">
              <hr />
              <div id="categoryList" style="max-height:400px;overflow:auto">
                <!-- categories (generated client-side or static) -->
                <div class="form-check"><input class="form-check-input cat-checkbox" type="checkbox" value="jewelery" id="cat_jewelery"><label class="form-check-label" for="cat_jewelery">Jewelery</label></div>
                <div class="form-check"><input class="form-check-input cat-checkbox" type="checkbox" value="electronics" id="cat_electronics"><label class="form-check-label" for="cat_electronics">Electronics</label></div>
                <div class="form-check"><input class="form-check-input cat-checkbox" type="checkbox" value="men's clothing" id="cat_mens"><label class="form-check-label" for="cat_mens">Men's Clothing</label></div>
                <div class="form-check"><input class="form-check-input cat-checkbox" type="checkbox" value="women's clothing" id="cat_womens"><label class="form-check-label" for="cat_womens">Women's Clothing</label></div>
              </div>
              <div class="mt-3 d-flex gap-2">
                <button id="applyFilterBtn" class="btn btn-sm btn-primary">Apply Filter</button>
                <button id="clearFilterBtn" class="btn btn-sm btn-secondary">Clear Filter</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-9">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <select id="sortSelect" class="form-select form-select-sm" style="width:220px">
                <option value="">Sort: Default</option>
                <option value="price_asc">Price: Low → High</option>
                <option value="price_desc">Price: High → Low</option>
                <option value="rating_desc">Rating</option>
              </select>
            </div>
            <div>
              <!-- placeholder for future controls -->
            </div>
          </div>

          <div id="productGrid" class="row g-3">
            <!-- products injected here -->
          </div>
        </div>
      </div>
    </div>

    <div class="toast-pos">
      <div id="msgToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">Added to cart</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/jquery.js"></script>
    <script src="/javascripts/main.js"></script>
    <script src="/javascripts/login.js"></script>
    <script src="/javascripts/logoutUser.js"></script>
    <script src="/javascripts/profile.js"></script>
    <script src="/javascripts/cartStorage.js"></script>
    <script src="/javascripts/commonLayout.js"></script>
    <script src="/javascripts/productList.js"></script>
  </body>
</html>
